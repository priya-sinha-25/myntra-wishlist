name: Discovery Pipeline (Daily)

on:
  workflow_dispatch:
    inputs:
      scrape_count:
        description: "Play Store reviews to fetch"
        required: false
        default: "100"
      classify_limit:
        description: "Max new items to classify (empty = all new)"
        required: false
        default: ""
  schedule:
    # 10:00 AM IST daily (04:30 UTC)
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  daily-discovery-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily sync (live scrape + classify + aggregate)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.classify_limit }}" ]; then
            LIMIT_ARG="--classify-limit ${{ github.event.inputs.classify_limit }}"
          fi
          python -m discovery.daily_sync \
            --scrape-count "${{ github.event.inputs.scrape_count || '100' }}" \
            $LIMIT_ARG

      - name: Commit updated discovery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(discovery): daily live scrape sync $(date -u +%Y-%m-%d)"
            git push
          fi
